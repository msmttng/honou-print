<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案内状・御礼状 作成 - 奉納ビラ印刷システム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho+B1:wght@400;600&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@400;500&family=Kaisei+Tokumin:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "HGSGyoshotai";
    src: url("hgs_gyoshotai.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --primary: #8C2D38; --primary-dark: #4A1C1D; --bg: #f8fafc;
    --border: #cbd5e1; --text: #1e293b; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); }

  header.appbar { background: var(--primary-dark); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header.appbar h1 { font-size: 16px; font-weight: 700; }
  header.appbar a { color: #fff; text-decoration: none; font-size: 13px; opacity: .85; }

  .tabs { display: flex; gap: 6px; padding: 10px 16px 0; }
  .tab-btn { padding: 10px 22px; border: 1px solid var(--border); border-bottom: none; background: #e2e8f0; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 14px; font-weight: 600; }
  .tab-btn.active { background: #fff; color: var(--primary); }

  .layout { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .panel h2 { font-size: 14px; color: var(--primary-dark); border-left: 4px solid var(--primary); padding-left: 8px; margin-bottom: 12px; }
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  input[type=text], select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
  textarea { min-height: 130px; line-height: 1.7; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: #e2e8f0; color: var(--text); }
  .btn-block { width: 100%; justify-content: center; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  /* 宛名リスト */
  .recipient-list { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  .recipient-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px; cursor: pointer; }
  .recipient-item:hover { background: #fdf2f4; }
  .recipient-item .addr { color: var(--muted); font-size: 11px; }
  .count-note { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* ===== はがきプレビュー ===== */
  .preview-wrap { display: flex; flex-wrap: wrap; gap: 16px; }
  .hagaki {
    width: 300px; height: 444px; /* 100x148mm → 3px/mm */
    background: #fff; border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); position: relative; overflow: hidden;
  }
  .hagaki-label { position: absolute; left: 6px; bottom: 4px; font-size: 10px; color: #94a3b8; pointer-events: none; }

  /* 移動可能ブロック */
  .drag { cursor: grab; }
  .drag:hover { outline: 1.5px dashed #8C2D38; outline-offset: 2px; }
  .drag.selected { outline: 2px solid #2563eb; outline-offset: 2px; cursor: grabbing; }

  /* 裏面: 縦書きブロック（個別配置） */
  .ura-block { position: absolute; writing-mode: vertical-rl; -webkit-writing-mode: vertical-rl; font-size: 15px; line-height: 2.1; letter-spacing: 2px; white-space: pre-line; }

  /* 表面（宛名面） */
  .omote-zip { position: absolute; display: flex; gap: 3px; }
  .omote-zip span { width: 22px; height: 30px; border: 1.5px solid #d48; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  .omote-block { position: absolute; writing-mode: vertical-rl; -webkit-writing-mode: vertical-rl; letter-spacing: 2px; white-space: pre-line; }

  .hint-bar { font-size: 12px; color: var(--muted); margin: 8px 0; line-height: 1.6; }

  /* ===== 印刷 ===== */
  .print-area { display: none; }
  @media print {
    body > *:not(.print-area) { display: none !important; }
    .print-area { display: block; }
    @page { size: 100mm 148mm; margin: 0; }
    .print-hagaki { width: 100mm; height: 148mm; position: relative; overflow: hidden; page-break-after: always; }
    /* 印刷時は px→mm 換算(3px=1mm)でJSがインラインstyleを付与する */
  }
</style>
</head>
<body>

<header class="appbar">
  <a href="index.html">← 戻る</a>
  <h1>案内状・御礼状 作成</h1>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabAnnai" onclick="switchMode('annai')">案内状</button>
  <button class="tab-btn" id="tabOrei" onclick="switchMode('orei')">御礼状</button>
</div>

<div class="layout">
  <!-- ===== 左パネル: 設定 ===== -->
  <div>
    <div class="panel" style="margin-bottom: 14px;">
      <h2>書体・差出人（共通）</h2>
      <div class="form-group">
        <label>書体</label>
        <select id="fontSelect" onchange="renderAll()">
          <option value="HGSGyoshotai">行書体（毛筆・既存）</option>
          <option value="'Yuji Syuku', serif">佑字 肅（毛筆・かすれ）</option>
          <option value="'Noto Serif JP', serif" selected>明朝体（標準・正式）</option>
          <option value="'Shippori Mincho B1', serif">しっぽり明朝（上品）</option>
          <option value="'Kaisei Tokumin', serif">解星 特ミン（楷書風）</option>
          <option value="'Zen Maru Gothic', sans-serif">丸ゴシック（親しみ）</option>
          <option value="'Noto Sans JP', sans-serif">ゴシック体（現代的）</option>
        </select>
      </div>
      <div class="form-group">
        <label>差出人（宛名面の左下に印字）</label>
        <textarea id="senderText" style="min-height:70px;" oninput="renderAll()" placeholder="例：&#10;穴守稲荷神社 奉賛会&#10;東京都大田区羽田五丁目2番7号"></textarea>
      </div>
    </div>

    <div class="panel" style="margin-bottom: 14px;" id="annaiPanel">
      <h2>案内状の内容（裏面＝出欠返信面）</h2>
      <div class="form-group">
        <label>表題</label>
        <input type="text" id="annaiTitle" value="例大祭 直会のご案内" oninput="renderAll()">
      </div>
      <div class="form-group">
        <label>日程①（縦書き・漢数字推奨）</label>
        <div class="row2">
          <input type="text" id="date1" value="七月二十九日（土）" oninput="renderAll()">
          <input type="text" id="time1" value="十七時三十分" oninput="renderAll()">
        </div>
      </div>
      <div class="form-group">
        <label>日程②（不要なら空欄）</label>
        <div class="row2">
          <input type="text" id="date2" value="七月三十日（日）" oninput="renderAll()">
          <input type="text" id="time2" value="十五時" oninput="renderAll()">
        </div>
      </div>
      <div class="form-group">
        <label>記入欄ラベル</label>
        <div class="row2">
          <input type="text" id="fieldLabel1" value="団体名" oninput="renderAll()">
          <input type="text" id="fieldLabel2" value="代表者名" oninput="renderAll()">
        </div>
      </div>
      <div class="form-group">
        <label>結びの文</label>
        <input type="text" id="annaiClosing" value="よろしくお願いします。" oninput="renderAll()">
      </div>
    </div>

    <div class="panel" style="margin-bottom: 14px; display: none;" id="oreiPanel">
      <h2>御礼状の内容</h2>
      <div class="form-group">
        <label>テンプレート（選んでから自由に修正できます）</label>
        <select id="oreiTemplate" onchange="loadOreiTemplate()">
          <option value="hounou">奉納御礼</option>
          <option value="sairei">祭礼終了のご報告と御礼</option>
          <option value="kishin">御寄進御礼</option>
          <option value="free">汎用（白紙から）</option>
        </select>
      </div>
      <div class="form-group">
        <label>表題</label>
        <input type="text" id="oreiTitle" value="御礼" oninput="renderAll()">
      </div>
      <div class="form-group">
        <label>本文（縦書きで印刷されます。改行＝改列）</label>
        <textarea id="oreiBody" style="min-height:200px;" oninput="renderAll()"></textarea>
      </div>
      <div class="form-group">
        <label>差出人署名（本文末尾）</label>
        <input type="text" id="oreiSign" value="" oninput="renderAll()" placeholder="例：穴守稲荷神社 宮司 ○○○○">
      </div>
    </div>

    <div class="panel">
      <h2>宛名（奉納者名簿から選択）</h2>
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <button class="btn btn-secondary btn-sm" onclick="loadRecords()">端末の名簿を再読込</button>
        <button class="btn btn-secondary btn-sm" onclick="loadFromGAS()">☁ スプレッドシートから取得</button>
      </div>
      <div class="count-note" id="gasStatus" style="margin: 0 0 8px;"></div>
      <input type="text" id="recipientSearch" placeholder="氏名で検索..." oninput="renderRecipients()" style="margin-bottom:8px;">
      <div class="recipient-list" id="recipientList"></div>
      <div class="count-note"><span id="selCount">0</span> 名選択中（住所未登録の方は宛名面の住所が空欄になります）</div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn btn-secondary" onclick="toggleAllRecipients()">全選択/解除</button>
        <button class="btn btn-primary btn-block" onclick="printAll()">🖨 選択した宛名で印刷</button>
      </div>
      <div class="count-note" style="margin-top:8px;">※印刷は「裏面→表面」の順に1名ずつ出力されます。プリンタの両面設定（短辺とじ）を使うと1枚に収まります。</div>
    </div>
  </div>

  <!-- ===== 右パネル: プレビュー ===== -->
  <div class="panel">
    <h2>プレビュー（左：裏面 ／ 右：表面・宛名）</h2>
    <div class="hint-bar">
      ✋ 文字ブロックは<b>ドラッグで移動</b>できます。クリックで選択後、<b>矢印キー</b>で微調整（Shift+矢印＝大きく移動）。位置は自動保存され、印刷にもそのまま反映されます。
    </div>
    <div style="margin-bottom: 8px;">
      <button class="btn btn-secondary btn-sm" onclick="resetOffsets()">配置をリセット（この面の種類のみ）</button>
      <span class="count-note" id="posInfo" style="margin-left: 8px;"></span>
    </div>
    <div class="preview-wrap">
      <div class="hagaki" id="uraHagaki"><div id="uraPreview" style="position:absolute; inset:0;"></div><span class="hagaki-label">裏面</span></div>
      <div class="hagaki" id="omoteHagaki"><div id="omotePreview" style="position:absolute; inset:0;"></div><span class="hagaki-label">表面（宛名）</span></div>
    </div>
  </div>
</div>

<div class="print-area" id="printArea"></div>

<script>
// ================= 状態 =================
let mode = 'annai';
let dbRecords = [];
const selectedIds = new Set();
let selectedBlockKey = null;

// 位置オフセット {key: {x, y}} 単位: プレビューpx (3px = 1mm)
const OFFSET_STORE = "letter_offsets_v2";
let offsets = {};
try { offsets = JSON.parse(localStorage.getItem(OFFSET_STORE) || "{}"); } catch (e) { offsets = {}; }
function saveOffsets() { try { localStorage.setItem(OFFSET_STORE, JSON.stringify(offsets)); } catch (e) {} }
function off(key) { return offsets[key] || { x: 0, y: 0 }; }

// ================= ブロック定義（基準位置: プレビューpx） =================
// 裏面（案内状）
const URA_ANNAI_BLOCKS = [
  { key: "annai_title",  x: 244, y: 24,  fs: 19, bold: true,  text: () => val("annaiTitle") },
  { key: "annai_d1",     x: 196, y: 24,  fs: 15, text: () => val("date1") + "\n" + val("time1") },
  { key: "annai_r1",     x: 158, y: 40,  fs: 14, text: () => "参加 ・ 不参加 （　　名）" },
  { key: "annai_d2",     x: 120, y: 24,  fs: 15, text: () => val("date2") ? (val("date2") + "\n" + val("time2")) : "" },
  { key: "annai_r2",     x: 82,  y: 40,  fs: 14, text: () => val("date2") ? "参加 ・ 不参加 （　　名）" : "" },
  { key: "annai_f1",     x: 54,  y: 30,  fs: 14, text: () => val("fieldLabel1") + "〔　　　　　　　〕" },
  { key: "annai_f2",     x: 30,  y: 30,  fs: 14, text: () => val("fieldLabel2") + "〔　　　　　　　〕" },
  { key: "annai_close",  x: 6,   y: 60,  fs: 13, text: () => val("annaiClosing") },
];
// 裏面（御礼状）
const URA_OREI_BLOCKS = [
  { key: "orei_title", x: 250, y: 26, fs: 19, bold: true, text: () => val("oreiTitle") },
  { key: "orei_body",  x: 40,  y: 26, fs: 12.5, lh: 2.0, text: () => val("oreiBody") },
  { key: "orei_sign",  x: 12,  y: 60, fs: 12,  text: () => val("oreiSign") },
];
// 表面（宛名面）
const OMOTE_BLOCKS = [
  { key: "omote_zip",    x: 0,  y: 0,  zip: true },          // 郵便番号枠 (基準: right:18,top:24)
  { key: "omote_addr",   x: 250, y: 72, fs: 15, text: (r) => r ? (r.address || "") : "東京都大田区羽田○丁目○番○号" },
  { key: "omote_name",   x: 140, y: 90, fs: 26, ls: 8, text: (r) => (r ? (r.name || "") : "奉納 太郎") + "　様" },
  { key: "omote_sender", x: 18, y: 224, fs: 11, lh: 1.8, text: () => val("senderText") },
];

function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }
function escapeHTML(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ================= 御礼状テンプレート（仮・後日差し替え可） =================
const OREI_TEMPLATES = {
  hounou: "拝啓　時下ますますご清栄のこととお慶び申し上げます。\nこのたびは当社例大祭に際し、ご丁重なる御奉納を賜り、誠にありがたく厚く御礼申し上げます。\nおかげをもちまして、祭礼を滞りなく斎行することができました。\n皆様のご健勝とご多幸を心よりご祈念申し上げます。\n敬具",
  sairei: "拝啓　益々ご清祥のこととお慶び申し上げます。\n先般の例大祭には、格別のご支援ご協力を賜り、誠にありがとうございました。\nおかげさまで諸行事を無事に終えることができましたことをご報告申し上げますとともに、心より御礼申し上げます。\n敬具",
  kishin: "拝啓　時下ますますご隆昌のこととお慶び申し上げます。\nこのたびはご丁重なる御寄進を賜り、誠に恐縮に存じます。\nご厚志は大切に活用させていただきます。\n略儀ながら書中をもちまして御礼申し上げます。\n敬具",
  free: ""
};

// ================= 名簿の取得（端末IndexedDB） =================
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("PdfMailMergeDB", 2);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function mergeRecords(list) {
  // 氏名で重複排除。住所が入っている方を優先して残す
  const map = new Map();
  [...dbRecords, ...list].forEach(r => {
    if (!r || !r.name) return;
    const cur = map.get(r.name);
    if (!cur || (!cur.address && r.address)) map.set(r.name, { ...cur, ...r });
  });
  dbRecords = [...map.values()].sort((a, b) => (a.name || "").localeCompare(b.name || "", "ja"));
}
async function loadRecords() {
  try {
    const db = await openDB();
    await new Promise((resolve) => {
      const tx = db.transaction("records", "readonly");
      const req = tx.objectStore("records").getAll();
      req.onsuccess = () => {
        const all = (req.result || []).filter(r => r.sync !== "pending_delete");
        mergeRecords(all);
        resolve();
      };
      req.onerror = () => resolve();
    });
  } catch (e) { console.warn("端末名簿の読み込みに失敗:", e); }
  renderRecipients();
  renderAll();
}

// ================= 名簿の取得（スプレッドシート/GAS） =================
function getGasUrl() {
  // 本体アプリと同じ保存キーを利用
  try { const u = localStorage.getItem("pdf_mail_merge_gas_url"); if (u) return u; } catch (e) {}
  return "";
}
async function loadFromGAS() {
  const status = document.getElementById("gasStatus");
  let gasUrl = getGasUrl();
  if (!gasUrl) {
    gasUrl = prompt("スプレッドシート連携（GAS）のURLを入力してください（本体アプリで設定済みなら自動で使われます）", "https://script.google.com/macros/s/…/exec") || "";
    if (!gasUrl.trim()) return;
    try { localStorage.setItem("pdf_mail_merge_gas_url", gasUrl.trim()); } catch (e) {}
  }
  status.textContent = "☁ スプレッドシートから取得中...";
  try {
    const fetchUrl = gasUrl + (gasUrl.includes("?") ? "&" : "?") + "mode=restore&t=" + Date.now();
    const res = await fetch(fetchUrl);
    const data = await res.json();
    if (!data.records || !Array.isArray(data.records)) throw new Error("応答形式が不正です");
    // GASの新旧どちらの列構成でも読めるように防御的にマッピング
    const list = data.records.map((r, i) => ({
      id: r.id || ("gas_" + i + "_" + (r.name || "")),
      name: (r.name || "").toString().trim(),
      address: (r.address || "").toString().trim(),
      bagNo: (r.bagNo || "").toString().trim(),
      sync: "synced"
    })).filter(r => r.name);
    mergeRecords(list);
    renderRecipients();
    renderAll();
    status.textContent = `☁ スプレッドシートから ${list.length}件 取得しました（氏名で統合済み）`;
  } catch (e) {
    status.textContent = "取得に失敗しました: " + e.message;
  }
}

// ================= UI =================
function switchMode(m) {
  mode = m;
  selectedBlockKey = null;
  document.getElementById("tabAnnai").classList.toggle("active", m === 'annai');
  document.getElementById("tabOrei").classList.toggle("active", m === 'orei');
  document.getElementById("annaiPanel").style.display = m === 'annai' ? "block" : "none";
  document.getElementById("oreiPanel").style.display = m === 'orei' ? "block" : "none";
  renderAll();
}
function loadOreiTemplate() {
  const key = document.getElementById("oreiTemplate").value;
  document.getElementById("oreiBody").value = OREI_TEMPLATES[key] || "";
  const titles = { hounou: "御奉納御礼", sairei: "御礼", kishin: "御寄進御礼", free: "御礼" };
  document.getElementById("oreiTitle").value = titles[key] || "御礼";
  renderAll();
}
function currentFont() { return document.getElementById("fontSelect").value; }

function renderRecipients() {
  const q = (document.getElementById("recipientSearch").value || "").trim();
  const list = document.getElementById("recipientList");
  list.innerHTML = "";
  dbRecords
    .filter(r => !q || (r.name || "").includes(q))
    .forEach(r => {
      const div = document.createElement("div");
      div.className = "recipient-item";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = selectedIds.has(r.id);
      cb.addEventListener("change", () => {
        cb.checked ? selectedIds.add(r.id) : selectedIds.delete(r.id);
        updateSelCount(); renderAll();
      });
      const span = document.createElement("span");
      span.innerHTML = `${escapeHTML(r.name || "")} <span class="addr">${escapeHTML(r.address || "（住所未登録）")}</span>`;
      div.appendChild(cb); div.appendChild(span);
      div.addEventListener("click", (e) => { if (e.target !== cb) { cb.checked = !cb.checked; cb.dispatchEvent(new Event("change")); } });
      list.appendChild(div);
    });
  updateSelCount();
}
function toggleAllRecipients() {
  const q = (document.getElementById("recipientSearch").value || "").trim();
  const visible = dbRecords.filter(r => !q || (r.name || "").includes(q));
  const allSelected = visible.length > 0 && visible.every(r => selectedIds.has(r.id));
  visible.forEach(r => allSelected ? selectedIds.delete(r.id) : selectedIds.add(r.id));
  renderRecipients(); renderAll();
}
function updateSelCount() { document.getElementById("selCount").textContent = selectedIds.size; }

// ================= ブロック描画 =================
function blockStyle(b, forPrint) {
  const o = off(b.key);
  const unit = forPrint ? (v) => (v / 3).toFixed(2) + "mm" : (v) => v + "px";
  const fs = forPrint ? ((b.fs || 15) / 3).toFixed(2) + "mm" : (b.fs || 15) + "px";
  const ls = (b.ls !== undefined ? b.ls : 2);
  return `left:${unit(b.x + o.x)}; top:${unit(b.y + o.y)}; font-size:${fs}; ` +
         `letter-spacing:${forPrint ? (ls / 3).toFixed(2) + "mm" : ls + "px"}; ` +
         (b.lh ? `line-height:${b.lh}; ` : "line-height:2.1; ") +
         (b.bold ? "font-weight:600; " : "") +
         `font-family:${currentFont()};`;
}
function buildZipHTML(record, forPrint) {
  const o = off("omote_zip");
  let zip = "";
  const m = (record ? (record.address || "") : "").match(/(\d{3})[-‐ー]?(\d{4})/);
  if (m) zip = m[1] + m[2];
  const boxes = [...Array(7)].map((_, i) => `<span>${zip[i] || ""}</span>`).join("");
  const pos = forPrint
    ? `top:${((24 + o.y) / 3).toFixed(2)}mm; right:${((18 - o.x) / 3).toFixed(2)}mm;`
    : `top:${24 + o.y}px; right:${18 - o.x}px;`;
  const boxCss = forPrint ? `--zw:7mm;` : "";
  return `<div class="omote-zip drag" data-key="omote_zip" style="${pos}">${boxes}</div>`;
}
function buildUraHTML(forPrint) {
  const blocks = mode === 'annai' ? URA_ANNAI_BLOCKS : URA_OREI_BLOCKS;
  return blocks
    .filter(b => (b.text ? (b.text() || "").trim() !== "" : true))
    .map(b => `<div class="ura-block drag" data-key="${b.key}" style="${blockStyle(b, forPrint)}">${escapeHTML(b.text ? b.text() : "")}</div>`)
    .join("");
}
function buildOmoteHTML(record, forPrint) {
  let html = buildZipHTML(record, forPrint);
  html += OMOTE_BLOCKS.filter(b => !b.zip)
    .map(b => `<div class="omote-block drag" data-key="${b.key}" style="${blockStyle(b, forPrint)}">${escapeHTML(b.text ? b.text(record) : "")}</div>`)
    .join("");
  return html;
}

// ================= プレビュー描画＋ドラッグ =================
function renderAll() {
  document.getElementById("uraPreview").innerHTML = buildUraHTML(false);
  const first = dbRecords.find(r => selectedIds.has(r.id));
  document.getElementById("omotePreview").innerHTML = buildOmoteHTML(first || null, false);
  attachDragHandlers();
  updatePosInfo();
}
function updatePosInfo() {
  const info = document.getElementById("posInfo");
  if (!selectedBlockKey) { info.textContent = ""; return; }
  const o = off(selectedBlockKey);
  info.textContent = `選択中: ${selectedBlockKey}　移動量 横 ${(o.x / 3).toFixed(1)}mm / 縦 ${(o.y / 3).toFixed(1)}mm`;
}
function attachDragHandlers() {
  document.querySelectorAll(".drag").forEach(el => {
    const key = el.dataset.key;
    if (selectedBlockKey === key) el.classList.add("selected");
    // マウス
    el.addEventListener("mousedown", (e) => startDrag(e, el, key, e.clientX, e.clientY));
    // タッチ
    el.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startDrag(e, el, key, t.clientX, t.clientY);
    }, { passive: false });
  });
}
function startDrag(e, el, key, startX, startY) {
  e.preventDefault();
  selectedBlockKey = key;
  document.querySelectorAll(".drag.selected").forEach(x => x.classList.remove("selected"));
  el.classList.add("selected");
  const base = { ...off(key) };
  const move = (cx, cy) => {
    offsets[key] = { x: Math.round(base.x + (cx - startX)), y: Math.round(base.y + (cy - startY)) };
    saveOffsets();
    renderAll();
    // 再描画後も選択を維持
    const nel = document.querySelector(`.drag[data-key="${key}"]`);
    if (nel) nel.classList.add("selected");
  };
  const onMouseMove = (ev) => move(ev.clientX, ev.clientY);
  const onTouchMove = (ev) => { const t = ev.touches[0]; move(t.clientX, t.clientY); ev.preventDefault(); };
  const cleanup = () => {
    window.removeEventListener("mousemove", onMouseMove);
    window.removeEventListener("mouseup", cleanup);
    window.removeEventListener("touchmove", onTouchMove);
    window.removeEventListener("touchend", cleanup);
  };
  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("mouseup", cleanup);
  window.addEventListener("touchmove", onTouchMove, { passive: false });
  window.addEventListener("touchend", cleanup);
  updatePosInfo();
}
// 矢印キーで微調整
window.addEventListener("keydown", (e) => {
  if (!selectedBlockKey) return;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
    // 入力欄にフォーカスがあるときは無効
    const tag = (document.activeElement || {}).tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    e.preventDefault();
    const step = e.shiftKey ? 9 : 1; // 3mm / 約0.33mm
    const o = { ...off(selectedBlockKey) };
    if (e.key === "ArrowUp") o.y -= step;
    if (e.key === "ArrowDown") o.y += step;
    if (e.key === "ArrowLeft") o.x -= step;
    if (e.key === "ArrowRight") o.x += step;
    offsets[selectedBlockKey] = o;
    saveOffsets();
    renderAll();
  }
});
function resetOffsets() {
  const keys = mode === 'annai'
    ? [...URA_ANNAI_BLOCKS.map(b => b.key), ...OMOTE_BLOCKS.map(b => b.key)]
    : [...URA_OREI_BLOCKS.map(b => b.key), ...OMOTE_BLOCKS.map(b => b.key)];
  keys.forEach(k => delete offsets[k]);
  saveOffsets();
  selectedBlockKey = null;
  renderAll();
}

// ================= 印刷 =================
function printAll() {
  const targets = dbRecords.filter(r => selectedIds.has(r.id));
  if (targets.length === 0) { alert("宛名を1名以上選択してください"); return; }
  const area = document.getElementById("printArea");
  let html = "";
  for (const r of targets) {
    html += `<div class="print-hagaki">${buildUraHTML(true)}</div>`;
    html += `<div class="print-hagaki">${buildOmoteHTML(r, true)}</div>`;
  }
  area.innerHTML = html;
  // 印刷用: 郵便番号枠のサイズをmmに変換
  area.querySelectorAll(".omote-zip span").forEach(s => {
    s.style.width = "7mm"; s.style.height = "10mm"; s.style.fontSize = "5mm"; s.style.borderWidth = "0.4mm";
  });
  window.print();
}

// ================= 起動 =================
window.addEventListener("DOMContentLoaded", () => {
  loadOreiTemplate();
  loadRecords();
  renderAll();
});
</script>
